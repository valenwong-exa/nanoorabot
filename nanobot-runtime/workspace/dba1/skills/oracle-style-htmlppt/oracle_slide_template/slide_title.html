<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oracle Slide Template</title>
  <style>
    /* =========================================================
       Oracle-style HTML Slide Template
       Purpose:
       - Used as a reusable PPT-like slide layout
       - AI should preserve this layout and only replace content
       - Focus on title page / cover page style
       - 16:9 canvas, suitable for screenshot or browser-to-PDF export
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1b1b1b;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, Helvetica, sans-serif;
    }

    /* =========================================================
       Slide canvas
       - Fixed 16:9 presentation page
       - All child elements are positioned relative to this box
       ========================================================= */
.slide {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

    /* =========================================================
       Background layer
       Usage rules for AI:
       1. If a background image is provided, place it here
       2. If no background image is available, use a solid color
       3. Do NOT place text directly inside this layer
       4. Background image should fill the whole slide
       ========================================================= */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;

      /* Put background image here */
      background-image: url('title.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* If a pure color background is required, use this instead */
      /* background-color: #0b4a59; */
    }

    /* =========================================================
       Optional overlay layer
       Usage rules for AI:
       - Use only when text readability needs improvement
       - Usually keep empty unless background is too bright/busy
       ========================================================= */
    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;

      /* Example:
      background: rgba(0, 0, 0, 0.08);
      */
    }

    /* =========================================================
       Foreground content layer
       - All visible text/content should be placed here
       - Keep this above background
       ========================================================= */
    .content-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* =========================================================
       Bottom confidential note
       Usage rules:
       - Usually fixed text
       - Do not remove unless explicitly requested
       ========================================================= */
    .confidential-bottom {
      position: absolute;
      left: 18px;
      bottom: 16px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.78);
      font-weight: 400;
      line-height: 1;
    }

    /* =========================================================
       Main content block
       Layout intent:
       - Content aligned to left side
       - Leave right side mostly open for decorative background
       - Avoid adding extra text blocks outside this region
       ========================================================= */
    .content {
      position: absolute;
      left: calc(35px + 10vw);
      top: calc(110px + 20vh);
      width: 980px;
    }

    /* =========================================================
       Logo area
       Usage rules for AI:
       - Usually fixed as ORACLE
       - Keep short
       - Do not replace with long sentence
       ========================================================= */
    .logo {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 34px;
      text-transform: uppercase;
      color: rgba(255, 213, 186, 0.95);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    }

    /* =========================================================
       Main title
       Usage rules for AI:
       1. This is the most prominent text on the page
       2. Prefer 1-3 lines
       3. Manually insert <br> for better visual balance
       4. Avoid one line being much longer than the others
       5. Keep title concise and executive-style
       6. If title is too long, shorten wording before shrinking font
       ========================================================= */
    .title {
      font-size: 68px;
      line-height: 1.12;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: rgba(255, 250, 244, 0.98);
      max-width: 920px;
      margin-bottom: 42px;
      text-shadow: 0 8px 26px rgba(0, 0, 0, 0.36);
    }

    /* =========================================================
       Subtitle
       Usage rules for AI:
       - One sentence or short phrase
       - Should support the title, not repeat it
       - Usually 1-2 lines
       - Can be omitted if not provided
       ========================================================= */
    .subtitle {
      font-size: 34px;
      line-height: 1.35;
      font-weight: 400;
      color: rgba(221, 239, 255, 0.95);
      max-width: 980px;
      margin-bottom: 42px;
    }

    /* =========================================================
       Accent line
       Usage rules:
       - Decorative separator
       - Keep size and color unchanged unless theme changes
       ========================================================= */
    .accent-line {
      width: 52px;
      height: 5px;
      background: #d56f3f;
      margin-bottom: 50px;
      box-shadow: 0 6px 18px rgba(213, 111, 63, 0.45);
    }

    /* =========================================================
       Speaker / author block
       Usage rules for AI:
       1. Optional block
       2. If no author info is provided, keep empty or hide content
       3. Typical order:
          - name
          - role/title
          - date
       4. Do not add long paragraph here
       ========================================================= */
    .speaker {
      font-size: 33px;
      line-height: 1.35;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.94);
      max-width: 760px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(7, 20, 26, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(2px);
    }

    .speaker .name {
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.98);
      font-weight: 600;
    }

    .speaker .role {
      margin-bottom: 10px;
      color: rgba(255, 208, 180, 0.95);
    }

    .speaker .date {
      margin-top: 4px;
      color: rgba(210, 230, 245, 0.9);
      font-size: 27px;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo,
    .title,
    .subtitle,
    .accent-line,
    .speaker {
      opacity: 0;
      animation: fade-up 0.72s ease forwards;
    }

    .logo {
      animation-delay: 0.08s;
    }

    .title {
      animation-delay: 0.2s;
    }

    .subtitle {
      animation-delay: 0.34s;
    }

    .accent-line {
      animation-delay: 0.46s;
    }

    .speaker {
      animation-delay: 0.58s;
    }

 

    /* =========================================================
       Optional utility classes for AI use
       - AI may use these when some fields are missing
       ========================================================= */
    .empty {
      visibility: hidden;
    }

    .hide {
      display: none;
    }
  </style>
</head>

<body>
  <!-- =======================================================
       Slide usage notes for AI
       -------------------------------------------------------
       This template is intended for a cover slide.

       AI editing rules:
       1. Keep the overall layout unchanged
       2. Replace only text content and background image/color
       3. Do not add large new sections outside the main content area
       4. Title should remain the visual focus
       5. Prefer elegant, concise, executive wording
       6. If information is missing, leave optional fields empty
       7. Preserve readability over completeness
       ======================================================= -->

  <div class="slide">
    <!-- Background layer: replace image or color here -->
    <div class="bg-layer"></div>

    <!-- Optional overlay layer: enable only if needed -->
    <div class="bg-overlay"></div>

    <!-- Foreground text/content layer -->
    <div class="content-layer">

      <!-- Main text area: keep all core text inside this block -->
      <div class="content">

        <!-- Brand / logo text -->
     

        <!--
          Main title:
          - Best in 2 to 4 lines
          - Insert <br> manually for balanced line length
          - Avoid too many words in one line
          - Do not put company icon or logo here
        -->
          
        <div class="title">
          标题第一行,<br>
          标题第二行<br>
          标题第三行
        </div>

        <!--
          Subtitle:
          - Short support sentence
          - Can be empty if not provided
        -->
        <div class="subtitle">
          副标题内容
        </div>

        <!-- Decorative accent line -->
        <div class="accent-line"></div>

        <!--
          Speaker block:
          - Optional
          - If no speaker info is available, leave fields empty
          - Or add class="hide" to the whole .speaker block
        -->
        <div class="speaker">
          <div class="name">Valen Wang</div>
          <div class="role">Sr Manager</div>
          <div class="date">2026-03-01</div>
        </div>
      </div>

      <!-- Bottom-right small branding icon -->
 

      <!-- Fixed confidentiality footer -->
      <!-- <div class="confidential-bottom">Confidential - Oracle Restricted</div> -->
    </div>
  </div>
</body>

</html>
