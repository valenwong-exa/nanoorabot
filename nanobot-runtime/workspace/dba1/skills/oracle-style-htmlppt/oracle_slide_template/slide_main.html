<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle Slide Deck Player</title>
    <style>
        /* =========================================================
       Oracle HTML Slide Deck Player - Fullscreen Version
       Purpose:
       - Play multiple slide HTML files in full browser screen
       - iframe fills the entire browser viewport
       - Navigation uses only left/right actions
       - AI should update only the slides array if filenames change
       ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
        }

        .deck-app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        /* =========================================================
       Fullscreen slide area
       - iframe directly fills entire browser area
       - no outer black border / no centered letterbox
       ========================================================= */
        .slide-frame-wrap {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        iframe#slideFrame {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #003b49;
        }

        /* =========================================================
       Click navigation zones
       - Left half = previous slide
       - Right half = next slide
       ========================================================= */
        .nav-zone {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 20;
            cursor: pointer;
        }

        .nav-zone.prev {
            left: 0;
        }

        .nav-zone.next {
            right: 0;
        }

        /* 可选：调试时可打开 hover 效果 */
        /*
    .nav-zone.prev:hover::after,
    .nav-zone.next:hover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
    }
    */

        /* =========================================================
       Bottom page indicator
       - Small and unobtrusive
       ========================================================= */
        .deck-status {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(4px);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.88);
            user-select: none;
        }

        .deck-page {
            min-width: 58px;
            text-align: center;
            font-weight: 700;
        }

        .deck-file {
            max-width: 360px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }

        /* =========================================================
       Hidden note for AI understanding
       ========================================================= */
        .sr-only {
            position: absolute !important;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>
    <!-- =======================================================
       SLIDE_MAIN_METADATA
       role: deck_controller
       purpose: play_multiple_slide_html_files
       rendering_mode: fullscreen_iframe
       navigation: left_right_only
       editing_rule: only_update_slides_array_when_filenames_change
       ======================================================= -->

    <!-- =======================================================
       AI usage instructions:
       1. This file is the main playback controller
       2. Each slide is an independent HTML file
       3. The iframe fills the whole browser screen
       4. Do not put slide body content into this file
       5. To change playback order, update the slides array only
       6. Generated slide filenames may vary
       7. All generated slide files must be listed in the slides array
       ======================================================= -->

    <div class="deck-app">
        <div class="slide-frame-wrap">
            <iframe id="slideFrame" title="Slide Player"></iframe>

            <div class="nav-zone prev" id="prevZone" aria-label="Previous slide" title="Previous slide"></div>
            <div class="nav-zone next" id="nextZone" aria-label="Next slide" title="Next slide"></div>
        </div>

        <div class="deck-status">
            <div class="deck-page" id="pageInfo">1 / 1</div>
            <div class="deck-file" id="fileInfo">slide.html</div>
        </div>

        <div class="sr-only">
            This file is only the deck player. It controls page order and navigation.
        </div>
    </div>

    <script>
        /* =========================================================
           Slide order configuration
           AI rules:
           - Update only this array if filenames change
           - Each item can be a string or an object
           - Object form is preferred
           ========================================================= */

        const slides = [
            { file: "slide_title.html", title: "Cover" },
            { file: "slide_agenda.html", title: "Agenda" },
            { file: "slide_page_1.html", title: "Content 1" },
            { file: "slide_page_left_right.html", title: "Left Right Columns" },
            { file: "slide_page_3_cols.html", title: "Three Columns" },
            { file: "slide_page_4_cols.html", title: "Four Columns" },
            { file: "slide_page_swot.html", title: "SWOT" },
            { file: "slide_section_title.html", title: "Section Title" },
            { file: "slide_end.html", title: "End" }
        ];

        const frame = document.getElementById("slideFrame");
        const pageInfo = document.getElementById("pageInfo");
        const fileInfo = document.getElementById("fileInfo");
        const prevZone = document.getElementById("prevZone");
        const nextZone = document.getElementById("nextZone");

        let currentIndex = 0;

        function normalizeSlide(slide) {
            if (typeof slide === "string") {
                return { file: slide, title: slide };
            }
            return {
                file: slide.file || "",
                title: slide.title || slide.file || ""
            };
        }

        function clampIndex(index) {
            if (index < 0) return 0;
            if (index >= slides.length) return slides.length - 1;
            return index;
        }

        function loadSlide(index) {
            if (!slides.length) {
                frame.srcdoc = `
          <html>
            <body style="margin:0;display:flex;align-items:center;justify-content:center;background:#003b49;color:white;font-family:Arial;">
              <div>No slides configured.</div>
            </body>
          </html>
        `;
                pageInfo.textContent = "0 / 0";
                fileInfo.textContent = "No slide file";
                return;
            }

            currentIndex = clampIndex(index);
            const slide = normalizeSlide(slides[currentIndex]);

            frame.src = slide.file;
            pageInfo.textContent = `${currentIndex + 1} / ${slides.length}`;
            fileInfo.textContent = slide.file;
            document.title = `Oracle HTML Deck - ${slide.title}`;

            updateHash();
        }

        function nextSlide() {
            if (currentIndex < slides.length - 1) {
                loadSlide(currentIndex + 1);
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                loadSlide(currentIndex - 1);
            }
        }

        function updateHash() {
            location.hash = `slide=${currentIndex + 1}`;
        }

        function parseHash() {
            const match = location.hash.match(/slide=(\d+)/);
            if (!match) return 0;
            const page = parseInt(match[1], 10);
            if (Number.isNaN(page)) return 0;
            return clampIndex(page - 1);
        }

        /* 鼠标左右点击翻页 */
        prevZone.addEventListener("click", prevSlide);
        nextZone.addEventListener("click", nextSlide);

        /* 键盘左右翻页 */
        window.addEventListener("keydown", (event) => {
            switch (event.key) {
                case "ArrowLeft":
                    event.preventDefault();
                    prevSlide();
                    break;
                case "ArrowRight":
                    event.preventDefault();
                    nextSlide();
                    break;
            }
        });

        /* 浏览器前进后退时同步页码 */
        window.addEventListener("hashchange", () => {
            loadSlide(parseHash());
        });

        /* 初始化 */
        loadSlide(parseHash());

        /* 供 AI 或其他脚本动态替换播放列表 */
        window.setSlides = function (newSlides) {
            if (!Array.isArray(newSlides) || newSlides.length === 0) return;
            slides.length = 0;
            slides.push(...newSlides);
            loadSlide(0);
        };
    </script>
</body>

</html>
