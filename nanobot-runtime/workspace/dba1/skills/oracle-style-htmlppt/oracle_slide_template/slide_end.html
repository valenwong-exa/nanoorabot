<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle End Slide</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1b1b1b;
            font-family: Arial, Helvetica, sans-serif;
        }

.slide {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

        /* 背景图：包含中间的 ORACLE 字样 */
        .bg-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            background-image: url('end.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #003b49;
        }

        .content-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        .confidential-top,
        .confidential-bottom {
            position: absolute;
            left: 0;
            font-size: 18px;
            line-height: 1;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.60);
        }

        .confidential-top {
            top: 12px;
        }

        .confidential-bottom {
            bottom: 6px;
        }

 
    </style>
</head>

<body>
    <div class="slide">
        <div class="bg-layer"></div>

        <div class="content-layer">
            <!-- <div class="confidential-top">Confidential - Oracle Restricted</div>
        
            <div class="confidential-bottom">Confidential - Oracle Restricted</div> -->
        </div>
    </div>
</body>

</html>
