<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oracle Content Slide Template</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1b1b1b;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, Helvetica, sans-serif;
    }

    .slide {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('page.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #003b49;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .content-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .confidential-top {
      position: absolute;
      left: 0px;
      top: 12px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.60);
      font-weight: 400;
      line-height: 1;
    }

    .content {
      position: absolute;
      left: 96px;
      right: 96px;
      top: calc(220px + 4vh);
      width: auto;
    }

    .header-block {
      position: absolute;
      left: 96px;
      top: 86px;
      width: 1100px;
    }

    .title {
      font-size: 62px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.3px;
      color: rgba(255, 250, 244, 0.98);
      margin-bottom: 12px;
      max-width: 1100px;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      color: rgba(218, 238, 255, 0.95);
      margin-bottom: 0;
      max-width: 1100px;
    }

    .body-content {
      width: 100%;
      height: 780px;
      color: rgba(255, 255, 255, 0.96);
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(5, 24, 35, 0.26);
      border: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(2px);
      overflow: visible;
    }

    .cards-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 22px 20px;
    }

    .card-item {
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(6, 24, 35, 0.34);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }

    .card-title {
      font-size: 30px;
      font-weight: 600;
      line-height: 1.2;
      color: rgba(255, 250, 244, 0.98);
      margin-bottom: 10px;
    }

    .card-text {
      font-size: 25px;
      font-weight: 400;
      line-height: 1.28;
      color: rgba(228, 242, 255, 0.94);
    }

    .hide {
      display: none;
    }

    .empty {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <div class="content-layer">
 

      <div class="header-block">
        <div class="title">Title</div>
        <div class="subtitle">subtitle</div>
      </div>

      <div class="content">
        <div class="body-content">
          <div class="cards-grid">
            <article class="card-item">
              <div class="card-title">Card 1</div>
              <div class="card-text">Key objective and owner.</div>
            </article>
            <article class="card-item">
              <div class="card-title">Card 2</div>
              <div class="card-text">Scope and delivery path.</div>
            </article>
            <article class="card-item">
              <div class="card-title">Card 3</div>
              <div class="card-text">Critical risk and control.</div>
            </article>
            <article class="card-item">
              <div class="card-title">Card 4</div>
              <div class="card-text">Milestone and KPI target.</div>
            </article>
            <article class="card-item">
              <div class="card-title">Card 5</div>
              <div class="card-text">Dependencies and timeline.</div>
            </article>
            <article class="card-item">
              <div class="card-title">Card 6</div>
              <div class="card-text">Next action and checkpoint.</div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
