<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanobot Robot Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ef;
      --panel: rgba(255, 252, 248, 0.92);
      --panel-soft: rgba(255, 255, 255, 0.92);
      --border: rgba(189, 198, 203, 0.42);
      --text: #2d3d45;
      --muted: #7c858c;
      --accent: #3b5c69;
      --accent-soft: rgba(162, 188, 198, 0.36);
      --online: #22c55e;
      --offline: #ef4444;
      --unknown: #f59e0b;
      --radius: 18px;
      --shadow: 0 2px 12px rgba(59, 92, 105, 0.08), 0 1px 3px rgba(59, 92, 105, 0.05);
      --sidebar-width: 360px;
      --split-ratio: 0.5;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(162, 188, 198, 0.28), transparent 26%),
        radial-gradient(circle at top right, rgba(220, 208, 190, 0.25), transparent 24%),
        linear-gradient(180deg, #faf7f2 0%, #f2ede6 100%);
    }

    body {
      overflow: hidden;
    }

    button,
    a {
      font: inherit;
    }

    button {
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    button:hover,
    .robot-item:hover {
      border-color: rgba(59, 92, 105, 0.42);
      transform: translateY(-1px);
    }

    button.active {
      background: var(--accent-soft);
      border-color: rgba(59, 92, 105, 0.68);
    }

    .floating-console-toggle {
      position: fixed;
      top: 92px;
      left: 0;
      z-index: 30;
      min-width: 30px;
      min-height: 96px;
      padding: 12px 6px;
      border-radius: 0 14px 14px 0;
      border-left: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.08em;
      font-size: 12px;
      line-height: 1.1;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease, opacity 0.16s ease;
    }

    .floating-console-toggle::after {
      content: "<";
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.72;
    }

    .floating-console-toggle.collapsed::after {
      content: ">";
    }

    .floating-console-toggle:hover {
      transform: translateX(1px);
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      height: 100vh;
      gap: 16px;
      padding: 16px;
      transition: grid-template-columns 0.22s ease;
    }

    .app.sidebar-collapsed {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .sidebar,
    .workspace-panel {
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      padding: 18px;
      overflow: hidden;
      transition: opacity 0.18s ease, transform 0.18s ease, padding 0.18s ease, border-width 0.18s ease;
    }

    .app.sidebar-collapsed .sidebar {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-16px);
      padding: 0;
      border-width: 0;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.1;
    }

    .brand p,
    .section-hint,
    .summary-item span:last-child {
      color: var(--muted);
    }

    .brand p {
      margin: 0;
      line-height: 1.55;
    }

    .sidebar-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-soft);
    }

    .collapsible-card {
      padding: 0;
      overflow: hidden;
    }

    .card-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .card-toggle::-webkit-details-marker {
      display: none;
    }

    .card-toggle::after {
      content: "+";
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }

    .collapsible-card[open] .card-toggle::after {
      content: "-";
    }

    .card-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .layout-group,
    .quick-actions,
    .selection-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .summary {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .robot-list {
      display: grid;
      gap: 10px;
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .robot-item {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    .robot-item.active {
      border-color: rgba(59, 92, 105, 0.42);
      background: rgba(242, 247, 249, 0.98);
      box-shadow: 0 10px 28px rgba(59, 92, 105, 0.08);
    }

    .robot-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .robot-name {
      margin: 0;
      font-size: 17px;
    }

    .robot-role {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .robot-controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .toggle input {
      margin: 0;
      accent-color: var(--online);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--unknown);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
    }

    .status-pill.online .status-dot {
      background: var(--online);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    .status-pill.offline .status-dot {
      background: var(--offline);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
    }

    .status-pill.checking .status-dot {
      background: var(--unknown);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
    }

    .workspace-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 16px;
      gap: 14px;
      min-width: 0;
    }

    .workspace-topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: var(--panel-soft);
    }

    .workspace-topbar h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .workspace-topbar p {
      margin: 0;
      color: var(--muted);
    }

    .workspace {
      min-height: 0;
      display: grid;
      gap: 14px;
      height: 100%;
    }

    .workspace.mode-1 {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr);
    }

    .workspace.mode-4 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .workspace.mode-2 {
      display: grid;
      grid-template-columns:
        minmax(0, calc((100% - 10px) * var(--split-ratio)))
        10px
        minmax(0, calc((100% - 10px) * (1 - var(--split-ratio))));
      gap: 0;
      min-height: 0;
      height: 100%;
    }

    .split-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .split-panel.primary {
      width: 100%;
    }

    .split-panel.secondary {
      width: 100%;
    }

    .split-panel > .panel {
      width: 100%;
      max-width: 100%;
    }

    .splitter {
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(162, 188, 198, 0.55), rgba(222, 228, 232, 0.72));
      border: 1px solid rgba(162, 188, 198, 0.48);
      cursor: col-resize;
      position: relative;
    }

    .splitter::after {
      content: "";
      position: absolute;
      inset: 18px 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: var(--shadow);
    }

    .panel.active {
      border-color: rgba(59, 92, 105, 0.46);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(246, 242, 236, 0.95));
      border-bottom: 1px solid var(--border);
    }

    .panel-head h3 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .panel-actions a {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      height: 100%;
      background: #f4efe8;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .frame-tip {
      position: absolute;
      right: 12px;
      bottom: 12px;
      max-width: calc(100% - 24px);
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      pointer-events: none;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.74);
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 1260px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: 100vh;
      }

      body {
        overflow: auto;
      }

      .sidebar,
      .workspace-panel {
        min-height: auto;
      }
    }

    @media (max-width: 980px) {
      .workspace.mode-4 {
        grid-template-columns: 1fr;
        grid-template-rows: none;
      }

      .workspace.mode-2 {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(2, minmax(0, 1fr));
      }

      .splitter {
        display: none;
      }

      .split-panel.primary,
      .split-panel.secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <button type="button" id="toggle-console" class="floating-console-toggle" aria-label="折叠控制台" title="折叠控制台">控制台</button>
  <div class="app">
    <aside class="sidebar">
      <section class="brand">
        <h1>AI机器人控制台</h1>
        <p>支持多机器人同时操作，四宫格模式下展示当前选中的前 4 个机器人。</p>
      </section>

      <details class="sidebar-card collapsible-card">
        <summary class="card-toggle">
          <span class="section-title">布局模式</span>
        </summary>
        <div class="card-body">
          <div class="layout-group" id="layout-controls">
            <button type="button" data-mode="1">单屏</button>
            <button type="button" data-mode="2">双屏</button>
            <button type="button" data-mode="4">四宫格</button>
          </div>
          <div class="summary">
            <div class="summary-item">
              <span>当前主机器人</span>
              <strong id="summary-active">-</strong>
            </div>
            <div class="summary-item">
              <span>当前显示数量</span>
              <strong id="summary-visible">0</strong>
            </div>
            <div class="summary-item">
              <span>在线机器人</span>
              <strong id="summary-online">0 / 4</strong>
            </div>
          </div>
          <div class="quick-actions">
            <button type="button" id="refresh-status">刷新在线状态</button>
            <button type="button" id="show-all">显示全部</button>
            <button type="button" id="focus-active">聚焦当前</button>
          </div>
          <p class="section-hint">双屏模式可在右侧拖拽分隔条调整两个 WebUI 的宽度比例；新增机器人后会自动出现在左侧列表中。</p>
        </div>
      </details>

      <section class="robot-list" id="robot-list"></section>


    </aside>

    <section class="workspace-panel">
      <header class="workspace-topbar">
        <div>
          <h2 id="workspace-title">机器人工作区</h2>
          <p id="workspace-subtitle">选择左侧机器人后，在这里统一操作 WebUI。</p>
        </div>
        <div class="selection-actions">
          <button type="button" id="open-active">打开当前机器人</button>
        </div>
      </header>
      <main class="workspace mode-4" id="workspace"></main>
    </section>
  </div>

  <template id="robot-item-template">
    <article class="robot-item">
      <div class="robot-top">
        <div>
          <h3 class="robot-name"></h3>
          <p class="robot-role"></p>
        </div>
        <div class="status-pill checking">
          <span class="status-dot"></span>
          <span class="status-text">检查中</span>
        </div>
      </div>
      <div class="robot-controls">
        <label class="toggle">
          <input type="checkbox" class="visibility-toggle">
          <span>显示</span>
        </label>
        <div class="quick-actions">
          <button type="button" class="activate-btn">设为主视图</button>
          <button type="button" class="open-btn">打开</button>
        </div>
      </div>
    </article>
  </template>

  <template id="panel-template">
    <article class="panel">
      <div class="panel-head">
        <div>
          <h3 class="panel-title"></h3>
          <p class="panel-subtitle"></p>
        </div>
        <div class="panel-actions">
          <button type="button" class="focus-btn">聚焦</button>
          <a class="open-link" target="_blank" rel="noopener noreferrer">新窗口</a>
          <button type="button" class="fullscreen-btn">全屏</button>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe loading="eager" referrerpolicy="no-referrer"></iframe>
         
      </div>
    </article>
  </template>

  <script>
    const STORAGE_KEY = "nanobot-robot-console-state-v1";
    const ROBOT_CONFIG_KEY = "nanobot-robot-config-v1";
    const DEFAULT_RATIO = 0.5;
    const DEFAULT_ROBOTS = [
      {
        id: "danny",
        name: "Danny",
        role: "AI系统专家",
        url: "http://127.0.0.1:18780/soul",
        healthUrl: "http://127.0.0.1:18780/"
      },
      {
        id: "fupeng",
        name: "付鹏",
        role: "AI Infrastructure专家",
        url: "http://127.0.0.1:18782/soul",
        healthUrl: "http://127.0.0.1:18782/"
      },
      {
        id: "ruiqiu",
        name: "瑞秋",
        role: "AI数据分析专家",
        url: "http://127.0.0.1:18783/soul",
        healthUrl: "http://127.0.0.1:18783/"
      },
      {
        id: "zhangjie",
        name: "张捷",
        role: "AI架构师",
        url: "http://127.0.0.1:18784/soul",
        healthUrl: "http://127.0.0.1:18784/"
      }
    ];
    const robots = loadRobots();

    const robotMap = new Map(robots.map((robot) => [robot.id, robot]));
    const layoutControls = document.getElementById("layout-controls");
    const robotList = document.getElementById("robot-list");
    const workspace = document.getElementById("workspace");
    const app = document.querySelector(".app");
    const panelTemplate = document.getElementById("panel-template");
    const robotItemTemplate = document.getElementById("robot-item-template");
    const refreshStatusButton = document.getElementById("refresh-status");
    const showAllButton = document.getElementById("show-all");
    const focusActiveButton = document.getElementById("focus-active");
    const openActiveButton = document.getElementById("open-active");
    const toggleConsoleButton = document.getElementById("toggle-console");
    const summaryActive = document.getElementById("summary-active");
    const summaryVisible = document.getElementById("summary-visible");
    const summaryOnline = document.getElementById("summary-online");
    const workspaceTitle = document.getElementById("workspace-title");
    const workspaceSubtitle = document.getElementById("workspace-subtitle");

    const state = loadState();
    const probeState = Object.fromEntries(robots.map((robot) => [
      robot.id,
      { status: "checking", checkedAt: null, message: "检查中" }
    ]));

    let draggingSplit = false;

    function slugifyRobotId(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function normalizeRobotDefinition(robot, index, seenIds) {
      if (!robot || typeof robot !== "object") {
        return null;
      }

      const name = String(robot.name || robot.id || ("Robot " + (index + 1))).trim();
      const role = String(robot.role || "未命名角色").trim();
      const url = String(robot.url || "").trim();
      if (!url) {
        return null;
      }

      let id = slugifyRobotId(robot.id || name || ("robot-" + (index + 1)));
      if (!id) {
        id = "robot-" + (index + 1);
      }

      let uniqueId = id;
      let suffix = 2;
      while (seenIds.has(uniqueId)) {
        uniqueId = id + "-" + suffix;
        suffix += 1;
      }
      seenIds.add(uniqueId);

      return {
        id: uniqueId,
        name,
        role,
        url,
        healthUrl: String(robot.healthUrl || url).trim() || url
      };
    }

    function normalizeRobotList(source, fallback = []) {
      const input = Array.isArray(source) ? source : fallback;
      const seenIds = new Set();
      const normalized = input
        .map((robot, index) => normalizeRobotDefinition(robot, index, seenIds))
        .filter(Boolean);

      if (normalized.length) {
        return normalized;
      }

      if (input !== fallback && fallback.length) {
        return normalizeRobotList(fallback, []);
      }

      return [];
    }

    function loadRobotsFromStorage() {
      try {
        const raw = localStorage.getItem(ROBOT_CONFIG_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_error) {
        return null;
      }
    }

    function loadRobots() {
      const externalRobots = Array.isArray(window.NANOBOT_ROBOTS) ? window.NANOBOT_ROBOTS : null;
      const storedRobots = loadRobotsFromStorage();
      return normalizeRobotList(externalRobots || storedRobots, DEFAULT_ROBOTS);
    }

    function loadState() {
      const firstRobot = robots[0];
      const base = {
        mode: 4,
        activeId: firstRobot ? firstRobot.id : "",
        selectedIds: robots.map((robot) => robot.id),
        splitRatio: DEFAULT_RATIO,
        sidebarCollapsed: false
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return base;
        }
        const parsed = JSON.parse(raw);
        const selectedIds = Array.isArray(parsed.selectedIds)
          ? parsed.selectedIds.filter((id) => robotMap.has(id))
          : base.selectedIds.slice();

        return {
          mode: [1, 2, 4].includes(parsed.mode) ? parsed.mode : base.mode,
          activeId: robotMap.has(parsed.activeId) ? parsed.activeId : base.activeId,
          selectedIds: selectedIds.length ? selectedIds : base.selectedIds.slice(),
          splitRatio: normalizeRatio(parsed.splitRatio),
          sidebarCollapsed: Boolean(parsed.sidebarCollapsed)
        };
      } catch (_error) {
        return base;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        mode: state.mode,
        activeId: state.activeId,
        selectedIds: state.selectedIds,
        splitRatio: state.splitRatio,
        sidebarCollapsed: state.sidebarCollapsed
      }));
    }

    function normalizeRatio(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) {
        return DEFAULT_RATIO;
      }
      return Math.max(0.2, Math.min(0.8, num));
    }

    function ensureValidSelection() {
      state.selectedIds = state.selectedIds.filter((id) => robotMap.has(id));
      if (!state.selectedIds.length && robots[0]) {
        state.selectedIds = [robots[0].id];
      }
      if (!state.selectedIds.includes(state.activeId)) {
        state.activeId = state.selectedIds[0] || "";
      }
      state.splitRatio = normalizeRatio(state.splitRatio);
    }

    function renderAppLayout() {
      app.classList.toggle("sidebar-collapsed", state.sidebarCollapsed);
      toggleConsoleButton.classList.toggle("active", state.sidebarCollapsed);
      toggleConsoleButton.classList.toggle("collapsed", state.sidebarCollapsed);
      toggleConsoleButton.title = state.sidebarCollapsed ? "展开控制台" : "折叠控制台";
      toggleConsoleButton.setAttribute("aria-label", toggleConsoleButton.title);
    }

    function currentVisibleRobots() {
      ensureValidSelection();
      const selected = state.selectedIds
        .map((id) => robotMap.get(id))
        .filter(Boolean);

      const active = robotMap.get(state.activeId) || selected[0];
      const ordered = [];
      if (active) {
        ordered.push(active);
      }
      for (const robot of selected) {
        if (robot && robot.id !== active.id) {
          ordered.push(robot);
        }
      }
      return ordered.slice(0, state.mode);
    }

    function modeLabel(mode) {
      if (mode === 1) return "单屏";
      if (mode === 2) return "双屏";
      return "四宫格";
    }

    function renderSidebar() {
      for (const button of layoutControls.querySelectorAll("button[data-mode]")) {
        button.classList.toggle("active", Number(button.dataset.mode) === state.mode);
      }

      robotList.innerHTML = "";
      for (const robot of robots) {
        const fragment = robotItemTemplate.content.cloneNode(true);
        const item = fragment.querySelector(".robot-item");
        const name = fragment.querySelector(".robot-name");
        const role = fragment.querySelector(".robot-role");
        const statusPill = fragment.querySelector(".status-pill");
        const statusText = fragment.querySelector(".status-text");
        const toggle = fragment.querySelector(".visibility-toggle");
        const activateButton = fragment.querySelector(".activate-btn");
        const openButton = fragment.querySelector(".open-btn");
        const statusInfo = probeState[robot.id];

        item.classList.toggle("active", robot.id === state.activeId);
        name.textContent = robot.name;
        role.textContent = robot.role;

        statusPill.className = "status-pill " + statusInfo.status;
        statusText.textContent = statusInfo.message;

        toggle.checked = state.selectedIds.includes(robot.id);
        toggle.addEventListener("change", (event) => {
          const checked = event.target.checked;
          if (checked) {
            if (!state.selectedIds.includes(robot.id)) {
              state.selectedIds.push(robot.id);
            }
          } else {
            if (state.selectedIds.length === 1) {
              event.target.checked = true;
              return;
            }
            state.selectedIds = state.selectedIds.filter((id) => id !== robot.id);
          }
          ensureValidSelection();
          saveState();
          render();
        });

        activateButton.addEventListener("click", () => {
          state.activeId = robot.id;
          if (!state.selectedIds.includes(robot.id)) {
            state.selectedIds.push(robot.id);
          }
          saveState();
          render();
        });

        openButton.addEventListener("click", () => {
          window.open(robot.url, "_blank", "noopener,noreferrer");
        });

        item.addEventListener("dblclick", () => {
          state.activeId = robot.id;
          state.mode = 1;
          if (!state.selectedIds.includes(robot.id)) {
            state.selectedIds.push(robot.id);
          }
          saveState();
          render();
        });

        robotList.appendChild(fragment);
      }
    }

    function setWorkspaceSummary(visibleRobots) {
      const activeRobot = robotMap.get(state.activeId);
      const onlineCount = robots.filter((robot) => probeState[robot.id].status === "online").length;
      summaryActive.textContent = activeRobot ? activeRobot.name : "-";
      summaryVisible.textContent = String(visibleRobots.length);
      summaryOnline.textContent = onlineCount + " / " + robots.length;

      if (activeRobot) {
        workspaceTitle.textContent = activeRobot.name + " 主视图";
        workspaceSubtitle.textContent = modeLabel(state.mode) + " | " + activeRobot.role;
      } else {
        workspaceTitle.textContent = "机器人工作区";
        workspaceSubtitle.textContent = "选择左侧机器人后，在这里统一操作 WebUI。";
      }
    }

    function fullscreenPanel(panel) {
      if (document.fullscreenElement === panel) {
        document.exitFullscreen().catch(() => {});
        return;
      }
      if (panel.requestFullscreen) {
        panel.requestFullscreen().catch(() => {});
      }
    }

    function createPanel(robot, isActive) {
      const fragment = panelTemplate.content.cloneNode(true);
      const panel = fragment.querySelector(".panel");
      const title = fragment.querySelector(".panel-title");
      const subtitle = fragment.querySelector(".panel-subtitle");
      const focusButton = fragment.querySelector(".focus-btn");
      const openLink = fragment.querySelector(".open-link");
      const fullscreenButton = fragment.querySelector(".fullscreen-btn");
      const iframe = fragment.querySelector("iframe");

      panel.classList.toggle("active", isActive);
      title.textContent = robot.name;
      subtitle.textContent = robot.role;
      openLink.href = robot.url;
      iframe.src = robot.url;
      iframe.title = robot.name + " - " + robot.role;

      focusButton.addEventListener("click", () => {
        state.activeId = robot.id;
        state.mode = 1;
        if (!state.selectedIds.includes(robot.id)) {
          state.selectedIds.push(robot.id);
        }
        saveState();
        render();
      });

      fullscreenButton.addEventListener("click", () => {
        fullscreenPanel(panel);
      });

      return panel;
    }

    function startSplitDrag(splitter, container) {
      splitter.addEventListener("pointerdown", (event) => {
        draggingSplit = true;
        splitter.setPointerCapture(event.pointerId);
        document.body.style.userSelect = "none";
        updateSplitRatio(event, container);
      });

      splitter.addEventListener("pointermove", (event) => {
        if (!draggingSplit) {
          return;
        }
        updateSplitRatio(event, container);
      });

      const stopDrag = () => {
        if (!draggingSplit) {
          return;
        }
        draggingSplit = false;
        document.body.style.userSelect = "";
        saveState();
      };

      splitter.addEventListener("pointerup", stopDrag);
      splitter.addEventListener("pointercancel", stopDrag);
      splitter.addEventListener("lostpointercapture", stopDrag);
    }

    function updateSplitRatio(event, container) {
      const rect = container.getBoundingClientRect();
      const ratio = (event.clientX - rect.left) / rect.width;
      state.splitRatio = normalizeRatio(ratio);
      container.style.setProperty("--split-ratio", String(state.splitRatio));
    }

    function renderWorkspace() {
      const visible = currentVisibleRobots();
      setWorkspaceSummary(visible);
      workspace.className = "workspace mode-" + state.mode;
      workspace.innerHTML = "";
      workspace.style.removeProperty("--split-ratio");

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = "<div><h3>没有可显示的机器人</h3><p class='muted'>请在左侧至少勾选一个机器人。</p></div>";
        workspace.appendChild(empty);
        return;
      }

      if (state.mode === 2) {
        const first = visible[0];
        const second = visible[1] || visible[0];
        const left = document.createElement("div");
        const right = document.createElement("div");
        const splitter = document.createElement("div");

        left.className = "split-panel primary";
        right.className = "split-panel secondary";
        splitter.className = "splitter";

        workspace.style.setProperty("--split-ratio", String(state.splitRatio));
        left.appendChild(createPanel(first, first.id === state.activeId));
        right.appendChild(createPanel(second, second.id === state.activeId));
        workspace.appendChild(left);
        workspace.appendChild(splitter);
        workspace.appendChild(right);
        startSplitDrag(splitter, workspace);
        return;
      }

      for (const robot of visible) {
        workspace.appendChild(createPanel(robot, robot.id === state.activeId));
      }
    }

    async function probeRobot(robot) {
      probeState[robot.id] = { status: "checking", checkedAt: Date.now(), message: "检查中" };
      renderSidebar();
      try {
        const response = await fetch(robot.healthUrl, {
          method: "GET",
          mode: "no-cors",
          cache: "no-store"
        });

        if (response.type === "opaque" || response.ok) {
          probeState[robot.id] = { status: "online", checkedAt: Date.now(), message: "在线" };
        } else {
          probeState[robot.id] = { status: "offline", checkedAt: Date.now(), message: "异常" };
        }
      } catch (_error) {
        probeState[robot.id] = { status: "offline", checkedAt: Date.now(), message: "离线" };
      }
      renderSidebar();
      setWorkspaceSummary(currentVisibleRobots());
    }

    async function refreshProbeStates() {
      await Promise.all(robots.map((robot) => probeRobot(robot)));
    }

    function render() {
      ensureValidSelection();
      saveState();
      renderAppLayout();
      renderSidebar();
      renderWorkspace();
    }

    layoutControls.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-mode]");
      if (!button) {
        return;
      }
      state.mode = Number(button.dataset.mode);
      saveState();
      render();
    });

    refreshStatusButton.addEventListener("click", () => {
      refreshProbeStates();
    });

    showAllButton.addEventListener("click", () => {
      state.selectedIds = robots.map((robot) => robot.id);
      saveState();
      render();
    });

    focusActiveButton.addEventListener("click", () => {
      state.mode = 1;
      saveState();
      render();
    });

    openActiveButton.addEventListener("click", () => {
      const activeRobot = robotMap.get(state.activeId);
      if (activeRobot) {
        window.open(activeRobot.url, "_blank", "noopener,noreferrer");
      }
    });

    toggleConsoleButton.addEventListener("click", () => {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      saveState();
      render();
    });

    render();
    refreshProbeStates();
    window.setInterval(refreshProbeStates, 30000);
  </script>
</body>
</html>
